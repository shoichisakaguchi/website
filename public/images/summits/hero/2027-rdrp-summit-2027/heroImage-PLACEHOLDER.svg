<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 459" role="img"
     aria-label="Placeholder for the RdRp Summit 2027 banner, artwork still to come">
  <title>RdRp Summit 2027 banner placeholder</title>
  <defs>
    <style>
      .frame { fill: #f4f4f5; stroke: #c9c9cf; stroke-width: 6; stroke-dasharray: 22 16; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .tag  { fill: #9a9aa4; font-size: 26px; font-weight: 700; letter-spacing: 6px; }
      .name { fill: #55555f; font-size: 76px; font-weight: 700; letter-spacing: 1px; }
      .meta { fill: #7a7a86; font-size: 34px; font-weight: 500; }
      .note { fill: #a8a8b2; font-size: 22px; }
    </style>
  </defs>

  <rect x="3" y="3" width="1594" height="453" rx="16" class="frame" />

  <text x="800" y="108" text-anchor="middle" class="tag">BANNER ARTWORK TO COME</text>
  <text x="800" y="220" text-anchor="middle" class="name">RdRp Summit 2027</text>
  <text x="800" y="286" text-anchor="middle" class="meta">Jena, Germany · 12 to 13 March 2027</text>
  <text x="800" y="386" text-anchor="middle" class="note">Placeholder for review. The 2025 banner was 3650 x 1047 px.</text>
</svg>
