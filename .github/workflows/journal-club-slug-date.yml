name: Journal Club Slug Date Check

on:
  pull_request:
    paths:
      - "src/content/journal-club/**"
      - "scripts/prefix-journal-club-date-slugs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/journal-club-slug-date.yml"
  push:
    branches:
      - main
    paths:
      - "src/content/journal-club/**"
      - "scripts/prefix-journal-club-date-slugs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/journal-club-slug-date.yml"

jobs:
  slug-date-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check journal club slug date prefixes
        run: npm run journal-club:slug-date:check
